connector.name=iceberg
iceberg.catalog.type=jdbc

jdbc.connection-url=jdbc:postgresql://postgres:5432/lakehouse
jdbc.user=lakehouse_user
jdbc.password=lakehouse_password

iceberg.jdbc-catalog.catalog-name=lakehouse

fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin123

iceberg.jdbc-catalog.default-warehouse-dir=s3://lakehouse/warehouse