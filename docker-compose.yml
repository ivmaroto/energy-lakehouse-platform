services:

  postgres:
    image: postgres:17
    container_name: energy-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

    networks:
      - lakehouse-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5


  minio:
    image: minio/minio:latest
    container_name: energy-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    networks:
      - lakehouse-network

    depends_on:
      postgres:
        condition: service_healthy


  spark-master:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile

    image: energy-spark:3.5
    container_name: energy-spark-master
    restart: unless-stopped

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master

    ports:
      - "7077:7077"
      - "8080:8080"

    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - ./spark/conf:/opt/spark/conf

    networks:
      - lakehouse-network

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started


  spark-worker:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile

    image: energy-spark:3.5
    container_name: energy-spark-worker
    restart: unless-stopped

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "2"
      - --memory
      - 2G

    ports:
      - "8081:8081"

    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - ./spark/conf:/opt/spark/conf

    networks:
      - lakehouse-network

    depends_on:
      spark-master:
        condition: service_started


  trino:
    image: trinodb/trino:483
    container_name: energy-trino
    restart: unless-stopped

    ports:
      - "8082:8080"

    volumes:
      - ./docker/trino:/etc/trino
      - trino_data:/data/trino

    networks:
      - lakehouse-network

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started


  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile

    image: energy-airflow:2.10.5
    container_name: energy-airflow-init

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow

    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname "${AIRFLOW_ADMIN_FIRSTNAME}" \
          --lastname "${AIRFLOW_ADMIN_LASTNAME}" \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL}" || true

    networks:
      - lakehouse-network

    depends_on:
      postgres:
        condition: service_healthy


  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile

    image: energy-airflow:2.10.5
    container_name: energy-airflow-webserver
    restart: unless-stopped

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow

      AEMET_API_KEY: ${AEMET_API_KEY}
      ESIOS_API_KEY: ${ESIOS_API_KEY}

      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-energy-lakehouse}
      MINIO_SECURE: "false"

      PYTHONPATH: /opt/airflow

    command: webserver

    ports:
      - "8083:8080"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./spark/jobs:/opt/spark/jobs
      - ./ingestion:/opt/airflow/ingestion

    networks:
      - lakehouse-network

    depends_on:
      airflow-init:
        condition: service_completed_successfully


  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile

    image: energy-airflow:2.10.5
    container_name: energy-airflow-scheduler
    restart: unless-stopped

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow

      AEMET_API_KEY: ${AEMET_API_KEY}
      ESIOS_API_KEY: ${ESIOS_API_KEY}

      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-energy-lakehouse}
      MINIO_SECURE: "false"

      PYTHONPATH: /opt/airflow

    command: scheduler

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./spark/jobs:/opt/spark/jobs
      - ./ingestion:/opt/airflow/ingestion

    networks:
      - lakehouse-network

    depends_on:
      airflow-init:
        condition: service_completed_successfully


  superset-init:
    build:
      context: .
      dockerfile: docker/superset/Dockerfile

    image: energy-superset:latest
    container_name: energy-superset-init

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}

    command:
      - /bin/sh
      - -c
      - |
        superset db upgrade &&
        superset fab create-admin \
          --username "${SUPERSET_ADMIN_USER}" \
          --firstname "${SUPERSET_ADMIN_FIRSTNAME}" \
          --lastname "${SUPERSET_ADMIN_LASTNAME}" \
          --email "${SUPERSET_ADMIN_EMAIL}" \
          --password "${SUPERSET_ADMIN_PASSWORD}" || true &&
        superset init

    networks:
      - lakehouse-network

    depends_on:
      postgres:
        condition: service_healthy


  superset:
    build:
      context: .
      dockerfile: docker/superset/Dockerfile

    image: energy-superset:latest
    container_name: energy-superset
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}

    command:
      - /bin/sh
      - -c
      - |
        gunicorn \
          --bind 0.0.0.0:8088 \
          --workers 2 \
          --timeout 120 \
          "superset.app:create_app()"

    ports:
      - "8088:8088"

    networks:
      - lakehouse-network

    depends_on:
      superset-init:
        condition: service_completed_successfully


networks:
  lakehouse-network:
    driver: bridge


volumes:
  postgres_data:
  minio_data:
  trino_data: